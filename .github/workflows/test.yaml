name: "Tests"

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: git fetch --prune --unshallow --tags -f

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.25.0

      - name: Lint
        run: script/lint

      - name: Test
        run: go test ./...